# Este flujo de trabajo subirá un paquete de Python usando Twine cuando se cree una release.
# Para más información: https://help.github.com/en/actions/language-and-framework-guides/using-python-with-github-actions#publishing-to-package-registries

name: Upload xycut-ppy Python Package con Maturin

on:
  release:
    types: [published]

jobs:
  deploy:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '>=3.10'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install maturin twine
    - name: Build wheel
      run: maturin build --release --out target/wheels
    - name: Publish to PyPI
      env:
        TWINE_USERNAME: ${{ secrets.PYPI_USERNAME }}
        TWINE_PASSWORD: ${{ secrets.PYPI_PASSWORD }}
      run: |
        twine upload target/wheels/*
