name: Publish xycutppy-paper to TestPyPI

# Se ejecutará cuando crees una Release en GitHub
on:
  release:
    types: [published]
  # 1. AÑADE ESTO: Permite ejecutar el workflow manualmente con un botón
  workflow_dispatch:

jobs:
  build:
    name: Build ${{ matrix.job.os }} | ${{ matrix.job.target }} | py${{ matrix.python-version }}
    runs-on: ${{ matrix.job.os }}
    strategy:
      fail-fast: false
      matrix:
        # 1. Definimos las versiones de Python (3.10 a 3.14)
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        # 2. Definimos las combinaciones OS/Target bajo 'job'
        job:
          # --- LINUX ---
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            python-architecture: x64
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            python-architecture: aarch64

          # --- WINDOWS ---
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            python-architecture: x64
          - os: windows-latest
            target: i686-pc-windows-msvc
            python-architecture: x86

          # --- macOS ---
          - os: macos-13  # Intel
            target: x86_64-apple-darwin
            python-architecture: x64
          - os: macos-latest  # Apple Silicon (M1/M2/M3)
            target: aarch64-apple-darwin
            python-architecture: arm64

    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false

    - name: Set up Python
      id: setup-python
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}
        architecture: ${{ matrix.job.python-architecture }}

    # Usamos shell: python. Es 100% seguro en Windows, macOS y Linux.
    - name: Patch metadata for Original Paper release
      shell: python
      run: |
        from pathlib import Path
        
        pyproject = Path("pyproject.toml")
        if pyproject.exists():
            pyproject.write_text(
                pyproject.read_text(encoding="utf-8")
                .replace('name = "xycutppy"', 'name = "xycutppy-paper"')
                .replace('license = "Apache-2.0"', 'license = "GPL-3.0"'),
                encoding="utf-8",
            )
            
        cargo = Path("Cargo.toml")
        if cargo.exists():
            cargo.write_text(
                cargo.read_text(encoding="utf-8").replace('license = "Apache-2.0"', 'license = "GPL-3.0"'),
                encoding="utf-8",
            )

    - name: Build wheel with Maturin (paper feature)
      uses: PyO3/maturin-action@v1
      with:
        target: ${{ matrix.job.target }}
        # IMPORTANTE: Mantenemos la feature 'paper'
        args: --release --features paper --out dist --interpreter "${{ steps.setup-python.outputs.python-path }}"

    - name: Store the distribution packages
      uses: actions/upload-artifact@v7
      with:
        # Añadido .job. para extraer la variable correctamente del nuevo formato de matriz
        name: python-package-distributions-paper-${{ matrix.job.os }}-${{ matrix.job.target }}-py${{ matrix.python-version }}
        path: dist/*.whl

  publish-to-testpypi:
    name: Publish Python 🐍 distribution 📦 to TestPyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/xycutppy-paper

    permissions:
      id-token: write

    steps:
    - name: Download all the dists
      uses: actions/download-artifact@v8
      with:
        pattern: python-package-distributions-paper-*
        merge-multiple: true
        path: dist/

    - name: Publish distribution 📦 to TestPyPI
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        repository-url: https://test.pypi.org/legacy/
        skip-existing: true
