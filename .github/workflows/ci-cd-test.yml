name: Publish xycutppy to TestPyPI

on:
  release:
    types: [published]
  # 1. AÑADE ESTO: Permite ejecutar el workflow manualmente con un botón
  workflow_dispatch:

jobs:
  build:
    name: Build ${{ matrix.job.os }} | ${{ matrix.job.target }} | py${{ matrix.python-version }}
    runs-on: ${{ matrix.job.os }}
    strategy:
      fail-fast: false
      matrix:
        # 1. Definimos el array con las versiones de Python
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        # 2. Definimos el array con las combinaciones de OS y Target
        job:
          # --- LINUX ---
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            python-architecture: x64
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            python-architecture: aarch64

          # --- WINDOWS ---
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            python-architecture: x64
          - os: windows-latest
            target: i686-pc-windows-msvc
            python-architecture: x86

          # --- macOS ---
          - os: macos-13  # Arquitectura Intel
            target: x86_64-apple-darwin
            python-architecture: x64
          - os: macos-latest  # Arquitectura Apple Silicon (M1/M2/M3)
            target: aarch64-apple-darwin
            python-architecture: arm64

    steps:
    # Usamos las versiones estables más recientes de las actions
    - uses: actions/checkout@v7
      with:
        persist-credentials: false

    - name: Set up Python
      id: setup-python
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}
        architecture: ${{ matrix.job.python-architecture }}

    - name: Build wheel with Maturin
      uses: PyO3/maturin-action@v1
      with:
        target: ${{ matrix.job.target }}
        # Al especificar el interpreter, Maturin compilará solo para esa versión de Python
        args: --release --out dist --interpreter "${{ steps.setup-python.outputs.python-path }}"

    - name: Store the distribution packages
      uses: actions/upload-artifact@v7
      with:
        # Añadimos el python-version al nombre para que los artefactos no se sobrescriban
        name: python-package-distributions-${{ matrix.job.os }}-${{ matrix.job.target }}-py${{ matrix.python-version }}
        path: dist/*.whl


  publish-to-testpypi:
    name: Publish Python 🐍 distribution 📦 to TestPyPI
    needs:
    - build
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/xycutppy

    permissions:
      id-token: write

    steps:
    - name: Download all the dists
      uses: actions/download-artifact@v8
      with:
        pattern: python-package-distributions-*
        merge-multiple: true
        path: dist/

    - name: Publish distribution 📦 to TestPyPI
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        repository-url: https://test.pypi.org/legacy/
        skip-existing: true
