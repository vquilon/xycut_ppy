name: Publish xycutppy-paper to PyPI

on:
  workflow_dispatch:

jobs:
  build:
    name: Build ${{ matrix.job.os }} | ${{ matrix.job.target }} | py${{ matrix.python-version }}
    runs-on: ${{ matrix.job.os }}
    strategy:
      fail-fast: false
      matrix:
        # 1. Definimos las versiones de Python (3.10 a 3.14)
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        # 2. Definimos las combinaciones OS/Target bajo 'job'
        job:
          # --- LINUX ---
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            python-architecture: x64
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            python-architecture: x64

          # --- WINDOWS ---
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            python-architecture: x64
          - os: windows-latest
            target: i686-pc-windows-msvc
            python-architecture: x86

          # --- macOS ---
          - os: macos-26-intel  # Intel
            target: x86_64-apple-darwin
            python-architecture: x64
          - os: macos-26  # Apple Silicon (M1/M2/M3)
            target: aarch64-apple-darwin
            python-architecture: arm64

    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false

    - name: Set up Python
      id: setup-python
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}
        architecture: ${{ matrix.job.python-architecture }}

    # Usamos shell: python. Es 100% seguro en Windows, macOS y Linux.
    - name: Patch metadata for Original Paper release
      shell: python
      run: |
        from pathlib import Path
        
        pyproject = Path("pyproject.toml")
        if pyproject.exists():
            pyproject.write_text(
                pyproject.read_text(encoding="utf-8")
                .replace('name = "xycutppy"', 'name = "xycutppy-paper"')
                .replace('license = "Apache-2.0"', 'license = "GPL-3.0"'),
                encoding="utf-8",
            )
            
        cargo = Path("Cargo.toml")
        if cargo.exists():
            cargo.write_text(
                cargo.read_text(encoding="utf-8").replace('license = "Apache-2.0"', 'license = "GPL-3.0"'),
                encoding="utf-8",
            )

    - name: Build wheel with Maturin (paper, Ubuntu alias)
      if: startsWith(matrix.job.os, 'ubuntu')
      uses: PyO3/maturin-action@v1
      with:
        target: ${{ matrix.job.target }}
        args: --release --features paper --out dist --interpreter "python${{ matrix.python-version }}"
        manylinux: auto

    - name: Build wheel with Maturin (paper, non-Ubuntu path)
      if: ${{ !startsWith(matrix.job.os, 'ubuntu') }}
      uses: PyO3/maturin-action@v1
      with:
        target: ${{ matrix.job.target }}
        args: --release --features paper --out dist --interpreter "${{ steps.setup-python.outputs.python-path }}"
        manylinux: auto

    - name: Store the distribution packages
      uses: actions/upload-artifact@v7
      with:
        # Añadido .job. para extraer la variable correctamente del nuevo formato de matriz
        name: python-package-distributions-paper-${{ matrix.job.os }}-${{ matrix.job.target }}-py${{ matrix.python-version }}
        path: dist/*.whl

  publish-to-pypi:
    name: Publish Python 🐍 distribution 📦 to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/xycutppy-paper

    permissions:
      id-token: write

    steps:
    - name: Download all the dists
      uses: actions/download-artifact@v8
      with:
        pattern: python-package-distributions-paper-*
        path: artifacts/

    - name: Validate and collect wheels
      shell: python
      run: |
        import shutil
        import zipfile
        from pathlib import Path

        artifacts = Path("artifacts")
        dist = Path("dist")
        dist.mkdir(parents=True, exist_ok=True)

        wheels = sorted(artifacts.rglob("*.whl"))
        if not wheels:
          raise SystemExit("No wheels found under artifacts/")

        def assert_no_trailing_data(path: Path) -> None:
          data = path.read_bytes()
          sig = b"PK\x05\x06"  # End of central directory signature
          eocd = data.rfind(sig)
          if eocd < 0:
            raise SystemExit(f"Invalid wheel (missing EOCD): {path}")
          if eocd + 22 > len(data):
            raise SystemExit(f"Invalid wheel (truncated EOCD): {path}")
          comment_len = int.from_bytes(data[eocd + 20:eocd + 22], "little")
          expected_end = eocd + 22 + comment_len
          if expected_end != len(data):
            raise SystemExit(f"Invalid wheel (trailing data): {path}")

        valid_wheels = []
        for wheel in wheels:
          out = dist / wheel.name
          if out.exists():
            print(f"Skipping duplicate wheel filename: {wheel.name}")
            continue
          with zipfile.ZipFile(wheel, "r") as zf:
            if zf.testzip() is not None:
              raise SystemExit(f"Corrupted wheel archive: {wheel}")
          assert_no_trailing_data(wheel)
          shutil.copy2(wheel, out)
          valid_wheels.append(out.name)

        if not valid_wheels:
          raise SystemExit("No valid wheels to publish after validation.")

        print("Valid wheels to publish:")
        for name in valid_wheels:
          print(f" - {name}")

    - name: Publish distribution 📦 to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        packages-dir: dist
        skip-existing: true
