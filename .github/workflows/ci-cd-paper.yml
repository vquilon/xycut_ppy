name: Upload xycutppy-paper Python Package with Maturin (xycutppy-paper)

on:
  push:
    tags:
      - 'paper-v*'  # Se ejecuta al pushear un tag tipo paper-v1.0.0

jobs:
  build-and-publish-paper:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '>=3.10'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install maturin twine

      # Modificamos los manifiestos al vuelo: nombre y licencia
      - name: Patch metadata for Original Paper release
        run: |
          sed -i 's/name = "xycutppy"/name = "xycutppy-paper"/' pyproject.toml
          sed -i 's/license = "Apache-2.0"/license = "GPL-3.0"/' pyproject.toml
          sed -i 's/license = "Apache-2.0"/license = "GPL-3.0"/' Cargo.toml

      - name: Build wheels (sin features GPL3)
        run: maturin build --release --features paper --out target/wheels

      - name: Publish to PyPI
        env:
          TWINE_USERNAME: ${{ secrets.PYPI_USERNAME }}
          TWINE_PASSWORD: ${{ secrets.PYPI_PASSWORD }}
        run: |
          twine upload target/wheels/*
