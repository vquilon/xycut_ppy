name: Publish xycutppy-paper to PyPI

# Se ejecutará cuando crees una Release en GitHub
on:
  release:
    types: [published]

jobs:
  build:
    name: Build ${{ matrix.os }} | ${{ matrix.target }} | py${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            python-architecture: x64
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            python-architecture: arm64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            python-architecture: x64
          - os: windows-latest
            target: i686-pc-windows-msvc
            python-architecture: x86

    steps:
    # Usamos las versiones estables más recientes de las actions
    - uses: actions/checkout@v7
      with:
        persist-credentials: false

    - name: Set up Python
      id: setup-python
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}
        architecture: ${{ matrix.python-architecture }}

    # Modificamos los manifiestos al vuelo: nombre y licencia
    - name: Patch metadata for Original Paper release
      run: |
        python - <<'PY'
        from pathlib import Path
        pyproject = Path("pyproject.toml")
        cargo = Path("Cargo.toml")
        pyproject.write_text(
            pyproject.read_text(encoding="utf-8")
            .replace('name = "xycutppy"', 'name = "xycutppy-paper"')
            .replace('license = "Apache-2.0"', 'license = "GPL-3.0"'),
            encoding="utf-8",
        )
        cargo.write_text(
            cargo.read_text(encoding="utf-8").replace('license = "Apache-2.0"', 'license = "GPL-3.0"'),
            encoding="utf-8",
        )
        PY

    - name: Build wheel with Maturin (paper feature)
      uses: PyO3/maturin-action@v1
      with:
        target: ${{ matrix.target }}
        args: --release --features paper --out dist --interpreter "${{ steps.setup-python.outputs.python-path }}"

    - name: Store the distribution packages
      uses: actions/upload-artifact@v7
      with:
        name: python-package-distributions-paper-${{ matrix.os }}-${{ matrix.target }}-py${{ matrix.python-version }}
        path: dist/*.whl

  publish-to-pypi:
    name: Publish Python 🐍 distribution 📦 to PyPI
    needs:
    - build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/xycutppy-paper

    permissions:
      id-token: write

    steps:
    - name: Download all the dists
      uses: actions/download-artifact@v8
      with:
        pattern: python-package-distributions-paper-*
        merge-multiple: true
        path: dist/

    - name: Publish distribution 📦 to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        skip-existing: true

  # Opcional: Publicar en TestPyPI.
  publish-to-testpypi:
    name: Publish Python 🐍 distribution 📦 to TestPyPI
    needs:
    - build
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/xycutppy-paper

    permissions:
      id-token: write

    steps:
    - name: Download all the dists
      uses: actions/download-artifact@v8
      with:
        pattern: python-package-distributions-paper-*
        merge-multiple: true
        path: dist/

    - name: Publish distribution 📦 to TestPyPI
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        repository-url: https://test.pypi.org/legacy/
        skip-existing: true
